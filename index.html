<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A timing helper for the final boss of Drakengard 3: expanding-ring note cues, live calibration, and exportable timings."
    />
    <meta name="theme-color" content="#120D15" />
    <script>
      // Resolve the theme before first paint so a saved light choice never
      // flashes the dark shell.
      try {
        var savedTheme = localStorage.getItem('dod3-theme');
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (error) {
        // Blocked storage or matchMedia leaves the dark default in place.
      }
    </script>
    <link rel="icon" type="image/png" href="./flower.png" />
    <title>Destroy the Flower — Drakengard 3 helper</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; font-family: sans-serif">
        This timing helper needs JavaScript to run. Enable JavaScript and reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
